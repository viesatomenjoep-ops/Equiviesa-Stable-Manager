<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating {
      animation: rotate 8s linear infinite;
      transform-origin: 100px 100px;
    }
  </style>

  <!-- Outer circle boundary -->
  <circle cx="100" cy="100" r="85" stroke="#000000" stroke-width="4" fill="none"/>

  <!-- Rotating arms group -->
  <g class="rotating">
    <!-- Arm 1 (top) -->
    <line x1="100" y1="100" x2="100" y2="25" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="25" r="8" fill="#000000"/>

    <!-- Arm 2 (right) -->
    <line x1="100" y1="100" x2="175" y2="100" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <circle cx="175" cy="100" r="8" fill="#000000"/>

    <!-- Arm 3 (bottom) -->
    <line x1="100" y1="100" x2="100" y2="175" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="175" r="8" fill="#000000"/>

    <!-- Arm 4 (left) -->
    <line x1="100" y1="100" x2="25" y2="100" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="100" r="8" fill="#000000"/>
  </g>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="12" fill="#000000"/>
  <circle cx="100" cy="100" r="6" fill="#FFFFFF"/>
</svg>